services:
  # 1. Layanan In-Memory Cache (Redis)
  redis:
    image: redis:alpine
    container_name: fnb_redis_cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - fnb_network

  # 2. Layanan Backend REST API (Node.js Express)
  backend:
    build: .
    container_name: fnb_backend_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - SUPABASE_URL=https://nwcuqytzyuciehhizaum.supabase.co
      - SUPABASE_ANON_KEY=sb_publishable_53HCYVWjSjMl0OxjttKdig_DUWxLCbL
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - INTERNAL_API_KEY=fnb_secret_internal_key_2026
    depends_on:
      - redis
    networks:
      - fnb_network

volumes:
  redis_data:
    driver: local

networks:
  fnb_network:
    driver: bridge